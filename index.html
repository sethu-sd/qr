<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart UPI Splitter & Real-Time Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    .calc-history::-webkit-scrollbar { width: 4px; }
    .calc-history::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 4px; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-3 relative">

  <!-- Main Splitter Card -->
  <div class="bg-white p-5 rounded-2xl shadow-xl w-full max-w-sm border border-gray-200 relative">
    
    <!-- Top Header & Calculator Toggle -->
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold text-gray-800">UPI Payment Hub</h1>
      <button onclick="toggleCalc()" class="bg-gray-900 text-white px-3 py-2 rounded-xl hover:bg-gray-700 transition flex items-center gap-1.5 text-xs font-semibold shadow-md">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
        Calculator
      </button>
    </div>
    
    <!-- Camera Scanner Section -->
    <div class="mb-4">
      <button id="scanBtn" onclick="toggleScanner()" class="w-full bg-emerald-600 text-white py-2.5 px-3 rounded-lg font-medium text-sm hover:bg-emerald-700 transition flex items-center justify-center gap-2 shadow-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        Scan QR Code with Camera
      </button>
      <div id="reader" class="mt-3 rounded-lg overflow-hidden hidden border border-gray-300"></div>
    </div>

    <!-- Inputs -->
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-600">UPI ID (VPA)</label>
        <input type="text" id="upiId" placeholder="example@upi" class="w-full mt-1 p-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600">Payee Name</label>
        <input type="text" id="payeeName" placeholder="Merchant Name" class="w-full mt-1 p-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600">Enter Total Amount (₹)</label>
        <input type="number" id="totalAmount" placeholder="e.g. 12899" class="w-full mt-1 p-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- Mode Selector -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Payment Method</label>
        <select id="splitMode" class="w-full p-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white font-medium text-gray-700">
          <option value="random">Split Randomly (₹1,599 – ₹1,959)</option>
          <option value="fixed">Split Fixed (₹1,999 Max)</option>
          <option value="full">Pay Full Amount (Single QR)</option>
        </select>
      </div>

      <!-- Action Button -->
      <button onclick="generateSplits()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-blue-700 transition mt-2">
        Generate Payment QR(s)
      </button>
    </div>

    <!-- Results Section -->
    <div id="results" class="mt-5 space-y-3 hidden">
      <div class="flex items-center justify-between border-b pb-2">
        <h2 class="text-sm font-bold text-gray-800">Ready to Pay</h2>
        <span id="totalChunksBadge" class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full font-medium"></span>
      </div>
      <div id="linksContainer" class="space-y-3"></div>
    </div>
  </div>

  <!-- Full-Screen Real-Time Calculator Overlay -->
  <div id="calcModal" class="fixed inset-0 bg-black z-50 flex flex-col justify-between p-6 hidden">
    
    <!-- Top Controls: History & Close -->
    <div class="flex justify-between items-center text-sm text-gray-400 border-b border-gray-800 pb-3">
      <button onclick="toggleHistoryView()" class="flex items-center gap-2 hover:text-white transition font-medium">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        History Log
      </button>
      <button onclick="toggleCalc()" class="text-gray-400 hover:text-white font-bold text-2xl px-2">✕</button>
    </div>

    <!-- Displays Screen -->
    <div class="text-right my-auto py-4">
      <!-- Scrollable History Container -->
      <div id="calcHistory" class="calc-history text-sm text-gray-400 max-h-40 overflow-y-auto space-y-2 font-mono mb-2 hidden border-b border-gray-800 pb-2"></div>
      <!-- Expression Input -->
      <div id="calcExpression" class="text-xl text-gray-400 font-mono tracking-wide min-h-[28px] break-words"></div>
      <!-- Real-Time Output -->
      <div id="calcDisplay" class="text-5xl md:text-6xl font-light text-white tracking-tight truncate my-2">0</div>
    </div>

    <!-- Keypad Grid (Full Screen Mobile Layout with Parentheses) -->
    <div class="grid grid-cols-4 gap-3 text-2xl font-medium max-w-md mx-auto w-full">
      <button onclick="calcClear()" class="bg-gray-700 text-red-400 py-4 rounded-2xl hover:bg-gray-600 active:scale-95 transition">AC</button>
      <button onclick="calcInput('(')" class="bg-gray-800 text-blue-400 py-4 rounded-2xl hover:bg-gray-700 active:scale-95 transition">(</button>
      <button onclick="calcInput(')')" class="bg-gray-800 text-blue-400 py-4 rounded-2xl hover:bg-gray-700 active:scale-95 transition">)</button>
      <button onclick="calcInput('/')" class="bg-orange-500 text-white py-4 rounded-2xl hover:bg-orange-400 active:scale-95 transition">÷</button>

      <button onclick="calcInput('7')" class="bg-gray-900 text-white py-4 rounded-2xl hover:bg-gray-800 active:scale-95 transition">7</button>
      <button onclick="calcInput('8')" class="bg-gray-900 text-white py-4 rounded-2xl hover:bg-gray-800 active:scale-95 transition">8</button>
      <button onclick="calcInput('9')" class="bg-gray-900 text-white py-4 rounded-2xl hover:bg-gray-800 active:scale-95 transition">9</button>
      <button onclick="calcInput('*')" class="bg-orange-500 text-white py-4 rounded-2xl hover:bg-orange-400 active:scale-95 transition">×</button>

      <button onclick="calcInput('4')" class="bg-gray-900 text-white py-4 rounded-2xl hover:bg-gray-800 active:scale-95 transition">4</button>
      <button onclick="calcInput('5')" class="bg-gray-900 text-white py-4 rounded-2xl hover:bg-gray-800 active:scale-95 transition">5</button>
      <button onclick="calcInput('6')" class="bg-gray-900 text-white py-4 rounded-2xl hover:bg-gray-800 active:scale-95 transition">6</button>
      <button onclick="calcInput('-')" class="bg-orange-500 text-white py-4 rounded-2xl hover:bg-orange-400 active:scale-95 transition">-</button>

      <button onclick="calcInput('1')" class="bg-gray-900 text-white py-4 rounded-2xl hover:bg-gray-800 active:scale-95 transition">1</button>
      <button onclick="calcInput('2')" class="bg-gray-900 text-white py-4 rounded-2xl hover:bg-gray-800 active:scale-95 transition">2</button>
      <button onclick="calcInput('3')" class="bg-gray-900 text-white py-4 rounded-2xl hover:bg-gray-800 active:scale-95 transition">3</button>
      <button onclick="calcInput('+')" class="bg-orange-500 text-white py-4 rounded-2xl hover:bg-orange-400 active:scale-95 transition">+</button>

      <button onclick="calcInput('0')" class="bg-gray-900 text-white py-4 rounded-2xl hover:bg-gray-800 active:scale-95 transition">0</button>
      <button onclick="calcInput('.')" class="bg-gray-900 text-white py-4 rounded-2xl hover:bg-gray-800 active:scale-95 transition">.</button>
      <button onclick="calcBackspace()" class="bg-gray-800 text-white py-4 rounded-2xl hover:bg-gray-700 active:scale-95 transition">⌫</button>
      <button onclick="commitCalculation()" class="bg-emerald-600 text-white py-4 rounded-2xl hover:bg-emerald-500 active:scale-95 transition">=</button>
    </div>

    <!-- Sync Result Button -->
    <button onclick="transferResultToApp()" class="w-full max-w-md mx-auto mt-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 rounded-2xl transition text-base">
      Use Result in UPI App
    </button>
  </div>

  <script>
    let html5QrCode = null;

    // --- Camera Scanner Logic ---
    function toggleScanner() {
      const readerDiv = document.getElementById('reader');
      const scanBtn = document.getElementById('scanBtn');

      if (readerDiv.classList.contains('hidden')) {
        readerDiv.classList.remove('hidden');
        scanBtn.innerText = "Close Scanner";
        scanBtn.classList.replace('bg-emerald-600', 'bg-red-600');

        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (decodedText) => {
            parseUPIString(decodedText);
            stopScanner();
          },
          () => {}
        ).catch(() => {
          alert("Camera access denied or unavailable.");
          stopScanner();
        });
      } else {
        stopScanner();
      }
    }

    function stopScanner() {
      const readerDiv = document.getElementById('reader');
      const scanBtn = document.getElementById('scanBtn');
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          readerDiv.classList.add('hidden');
          scanBtn.innerText = "Scan QR Code with Camera";
          scanBtn.classList.replace('bg-red-600', 'bg-emerald-600');
        }).catch(() => {});
      }
    }

    function parseUPIString(qrData) {
      try {
        if (qrData.startsWith("upi://pay")) {
          const urlParams = new URLSearchParams(qrData.split('?')[1]);
          const pa = urlParams.get('pa');
          const pn = urlParams.get('pn');
          const am = urlParams.get('am');

          if (pa) document.getElementById('upiId').value = pa;
          if (pn) document.getElementById('payeeName').value = decodeURIComponent(pn);
          if (am) document.getElementById('totalAmount').value = am;

          alert("Scanned! UPI details populated.");
        } else {
          alert("Invalid UPI QR code.");
        }
      } catch (e) {
        alert("Failed to parse QR code.");
      }
    }

    // --- Splitter Logic ---
    function getRandomChunk(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateSplits() {
      const upiId = document.getElementById('upiId').value.trim();
      const payeeName = encodeURIComponent(document.getElementById('payeeName').value.trim());
      const totalAmount = parseFloat(document.getElementById('totalAmount').value);
      const splitMode = document.getElementById('splitMode').value;
      const container = document.getElementById('linksContainer');
      
      container.innerHTML = '';
      if (!upiId || !totalAmount || totalAmount <= 0) {
        alert("Please enter a valid UPI ID and Amount.");
        return;
      }

      let remaining = totalAmount;
      let index = 1;

      if (splitMode === 'full') {
        createPaymentCard(container, 1, totalAmount.toFixed(2), upiId, payeeName);
      } else {
        while (remaining > 0) {
          let chunkSize;
          if (splitMode === 'fixed') {
            chunkSize = Math.min(remaining, 1999);
          } else {
            let randomVal = getRandomChunk(1599, 1959);
            chunkSize = (remaining < 1599) ? remaining : Math.min(remaining, randomVal);
          }

          const currentAmount = chunkSize.toFixed(2);
          createPaymentCard(container, index, currentAmount, upiId, payeeName);
          remaining -= chunkSize;
          index++;
        }
      }

      document.getElementById('totalChunksBadge').innerText = splitMode === 'full' ? 'Single Payment' : `${index - 1} QR Code(s)`;
      document.getElementById('results').classList.remove('hidden');
    }

    function createPaymentCard(container, index, amount, upiId, payeeName) {
      const upiUri = `upi://pay?pa=${upiId}&pn=${payeeName}&am=${amount}&cu=INR`;
      const qrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(upiUri)}&size=160`;

      const card = document.createElement('div');
      card.className = "p-3 border rounded-xl bg-gray-50 flex flex-col items-center gap-2 shadow-sm";
      card.innerHTML = `
        <div class="w-full flex justify-between items-center border-b pb-2">
          <span class="font-bold text-gray-800 text-sm">Payment #${index}</span>
          <span class="font-extrabold text-blue-600 text-base">₹${amount}</span>
        </div>
        <img src="${qrUrl}" alt="QR Code" class="w-32 h-32 rounded border bg-white p-1 my-1">
        <div class="w-full flex gap-2 mt-1">
          <a href="${upiUri}" class="flex-1 bg-blue-600 text-white py-1.5 px-2 rounded-lg text-xs font-medium text-center hover:bg-blue-700 transition">
            Open App to Pay ₹${amount}
          </a>
          <button onclick="navigator.clipboard.writeText('${upiUri}'); alert('UPI Link copied!')" class="bg-gray-200 text-gray-700 py-1.5 px-2 rounded-lg text-xs font-medium hover:bg-gray-300 transition">
            Copy
          </button>
        </div>
      `;
      container.appendChild(card);
    }

    // --- Real-Time Calculator Engine ---
    let calcExpr = localStorage.getItem('calcExpr') || "";
    let historyArr = JSON.parse(localStorage.getItem('calcHistoryArr') || "[]");

    window.addEventListener('DOMContentLoaded', () => {
      evaluateRealtime();
      renderHistory();
    });

    function toggleCalc() {
      document.getElementById('calcModal').classList.toggle('hidden');
    }

    function toggleHistoryView() {
      document.getElementById('calcHistory').classList.toggle('hidden');
    }

    function calcInput(val) {
      calcExpr += val;
      evaluateRealtime();
    }

    function calcBackspace() {
      calcExpr = calcExpr.slice(0, -1);
      evaluateRealtime();
    }

    function calcClear() {
      calcExpr = "";
      evaluateRealtime();
    }

    // Real-Time Evaluation without requiring '=' button
    function evaluateRealtime() {
      document.getElementById('calcExpression').innerText = calcExpr || "";
      
      if (!calcExpr) {
        document.getElementById('calcDisplay').innerText = "0";
        localStorage.setItem('calcExpr', "");
        return;
      }

      try {
        const formatted = calcExpr.replace(/×/g, '*').replace(/÷/g, '/');
        const result = eval(formatted);
        
        if (result !== undefined && !isNaN(result)) {
          document.getElementById('calcDisplay').innerText = result;
        }
      } catch (e) {
        // Keep previous valid result or show 0 on syntax error during typing
      }
      
      localStorage.setItem('calcExpr', calcExpr);
    }

    // Commit calculation manually to History
    function commitCalculation() {
      try {
        const formatted = calcExpr.replace(/×/g, '*').replace(/÷/g, '/');
        const result = eval(formatted);
        if (result !== undefined && !isNaN(result)) {
          const entry = `${calcExpr} = ${result}`;
          historyArr.push(entry);
          localStorage.setItem('calcHistoryArr', JSON.stringify(historyArr));
          renderHistory();
          calcExpr = result.toString();
          evaluateRealtime();
        }
      } catch (e) {}
    }

    function renderHistory() {
      const historyDiv = document.getElementById('calcHistory');
      historyDiv.innerHTML = "";
      historyArr.slice().reverse().forEach(item => {
        const entry = document.createElement('div');
        entry.className = "hover:text-white cursor-pointer transition";
        entry.innerText = item;
        entry.onclick = () => {
          calcExpr = item.split(' = ')[1];
          evaluateRealtime();
        };
        historyDiv.appendChild(entry);
      });
    }

    function transferResultToApp() {
      const val = parseFloat(document.getElementById('calcDisplay').innerText);
      if (!isNaN(val) && val > 0) {
        document.getElementById('totalAmount').value = val;
        toggleCalc();
      } else {
        alert("Enter a valid calculation.");
      }
    }
  </script>
</body>
</html>
