<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart UPI Splitter & Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    .calc-history::-webkit-scrollbar { width: 4px; }
    .calc-history::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 4px; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-3 relative">

  <!-- Main Splitter Card -->
  <div class="bg-white p-5 rounded-2xl shadow-xl w-full max-w-sm border border-gray-200 relative">
    
    <!-- Top Header & Calculator Button -->
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold text-gray-800">UPI Payment Hub</h1>
      <button onclick="toggleCalc()" class="bg-gray-900 text-white p-2 rounded-xl hover:bg-gray-700 transition flex items-center gap-1.5 text-xs font-semibold shadow-md">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
        Calc
      </button>
    </div>
    
    <!-- Camera Scanner Section -->
    <div class="mb-4">
      <button id="scanBtn" onclick="toggleScanner()" class="w-full bg-emerald-600 text-white py-2.5 px-3 rounded-lg font-medium text-sm hover:bg-emerald-700 transition flex items-center justify-center gap-2 shadow-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        Scan QR Code with Camera
      </button>
      <div id="reader" class="mt-3 rounded-lg overflow-hidden hidden border border-gray-300"></div>
    </div>

    <!-- Inputs -->
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-600">UPI ID (VPA)</label>
        <input type="text" id="upiId" placeholder="example@upi" class="w-full mt-1 p-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600">Payee Name</label>
        <input type="text" id="payeeName" placeholder="Merchant Name" class="w-full mt-1 p-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600">Enter Total Amount (₹)</label>
        <input type="number" id="totalAmount" placeholder="e.g. 12899" class="w-full mt-1 p-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- Mode Selector -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Payment Method</label>
        <select id="splitMode" class="w-full p-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white font-medium text-gray-700">
          <option value="random">Split Randomly (₹1,599 – ₹1,959)</option>
          <option value="fixed">Split Fixed (₹1,999 Max)</option>
          <option value="full">Pay Full Amount (Single QR)</option>
        </select>
      </div>

      <!-- Action Button -->
      <button onclick="generateSplits()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-blue-700 transition mt-2">
        Generate Payment QR(s)
      </button>
    </div>

    <!-- Results Section -->
    <div id="results" class="mt-5 space-y-3 hidden">
      <div class="flex items-center justify-between border-b pb-2">
        <h2 class="text-sm font-bold text-gray-800">Ready to Pay</h2>
        <span id="totalChunksBadge" class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full font-medium"></span>
      </div>
      <div id="linksContainer" class="space-y-3"></div>
    </div>
  </div>

  <!-- Multi-Feature Auto-Saving Pop-up Calculator Drawer -->
  <div id="calcModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3 hidden backdrop-blur-sm">
    <div class="bg-black text-white w-full max-w-xs rounded-3xl p-4 shadow-2xl border border-gray-800 flex flex-col justify-between">
      
      <!-- Top Bar: Science Toggle & Close -->
      <div class="flex justify-between items-center text-xs text-gray-400 mb-1">
        <button onclick="toggleScientific()" class="hover:text-white transition font-mono">Sci Mode</button>
        <div class="flex gap-2">
          <button onclick="clearCalcHistory()" class="hover:text-red-400 transition">Clear History</button>
          <button onclick="toggleCalc()" class="text-gray-400 hover:text-white font-bold text-base px-1">✕</button>
        </div>
      </div>

      <!-- Display Screen -->
      <div class="text-right py-2 px-1">
        <div id="calcHistory" class="calc-history text-xs text-gray-400 h-10 overflow-y-auto space-y-1 font-mono"></div>
        <div id="calcExpression" class="text-xs text-orange-400 h-4 font-mono"></div>
        <div id="calcDisplay" class="text-4xl font-light tracking-tight truncate my-1">0</div>
      </div>

      <!-- Memory Strip -->
      <div class="grid grid-cols-4 gap-1 mb-2 text-xs text-gray-400 font-semibold text-center">
        <button onclick="calcMem('MC')" class="py-1 hover:text-white">MC</button>
        <button onclick="calcMem('MR')" class="py-1 hover:text-white">MR</button>
        <button onclick="calcMem('M+')" class="py-1 hover:text-white">M+</button>
        <button onclick="calcMem('M-')" class="py-1 hover:text-white">M-</button>
      </div>

      <!-- Scientific Panel -->
      <div id="sciPanel" class="grid grid-cols-4 gap-1.5 mb-2 hidden">
        <button onclick="calcInput('Math.sin(')" class="bg-gray-800 py-2 rounded-lg text-xs hover:bg-gray-700">sin</button>
        <button onclick="calcInput('Math.cos(')" class="bg-gray-800 py-2 rounded-lg text-xs hover:bg-gray-700">cos</button>
        <button onclick="calcInput('Math.tan(')" class="bg-gray-800 py-2 rounded-lg text-xs hover:bg-gray-700">tan</button>
        <button onclick="calcInput('Math.sqrt(')" class="bg-gray-800 py-2 rounded-lg text-xs hover:bg-gray-700">√</button>
        <button onclick="calcInput('Math.log10(')" class="bg-gray-800 py-2 rounded-lg text-xs hover:bg-gray-700">log</button>
        <button onclick="calcInput('Math.log(')" class="bg-gray-800 py-2 rounded-lg text-xs hover:bg-gray-700">ln</button>
        <button onclick="calcInput('Math.PI')" class="bg-gray-800 py-2 rounded-lg text-xs hover:bg-gray-700">π</button>
        <button onclick="calcInput('**')" class="bg-gray-800 py-2 rounded-lg text-xs hover:bg-gray-700">x^y</button>
      </div>

      <!-- Main Keypad Grid -->
      <div class="grid grid-cols-4 gap-2 text-lg font-medium">
        <button onclick="calcClear()" class="bg-gray-400 text-black py-3 rounded-full hover:bg-gray-300">AC</button>
        <button onclick="calcToggleSign()" class="bg-gray-400 text-black py-3 rounded-full hover:bg-gray-300">±</button>
        <button onclick="calcInput('%')" class="bg-gray-400 text-black py-3 rounded-full hover:bg-gray-300">%</button>
        <button onclick="calcInput('/')" class="bg-orange-500 text-white py-3 rounded-full hover:bg-orange-400">÷</button>

        <button onclick="calcInput('7')" class="bg-gray-800 text-white py-3 rounded-full hover:bg-gray-700">7</button>
        <button onclick="calcInput('8')" class="bg-gray-800 text-white py-3 rounded-full hover:bg-gray-700">8</button>
        <button onclick="calcInput('9')" class="bg-gray-800 text-white py-3 rounded-full hover:bg-gray-700">9</button>
        <button onclick="calcInput('*')" class="bg-orange-500 text-white py-3 rounded-full hover:bg-orange-400">×</button>

        <button onclick="calcInput('4')" class="bg-gray-800 text-white py-3 rounded-full hover:bg-gray-700">4</button>
        <button onclick="calcInput('5')" class="bg-gray-800 text-white py-3 rounded-full hover:bg-gray-700">5</button>
        <button onclick="calcInput('6')" class="bg-gray-800 text-white py-3 rounded-full hover:bg-gray-700">6</button>
        <button onclick="calcInput('-')" class="bg-orange-500 text-white py-3 rounded-full hover:bg-orange-400">-</button>

        <button onclick="calcInput('1')" class="bg-gray-800 text-white py-3 rounded-full hover:bg-gray-700">1</button>
        <button onclick="calcInput('2')" class="bg-gray-800 text-white py-3 rounded-full hover:bg-gray-700">2</button>
        <button onclick="calcInput('3')" class="bg-gray-800 text-white py-3 rounded-full hover:bg-gray-700">3</button>
        <button onclick="calcInput('+')" class="bg-orange-500 text-white py-3 rounded-full hover:bg-orange-400">+</button>

        <button onclick="calcInput('0')" class="bg-gray-800 text-white py-3 rounded-full col-span-2 pl-6 text-left hover:bg-gray-700">0</button>
        <button onclick="calcInput('.')" class="bg-gray-800 text-white py-3 rounded-full hover:bg-gray-700">.</button>
        <button onclick="calcEqual()" class="bg-orange-500 text-white py-3 rounded-full hover:bg-orange-400">=</button>
      </div>

      <!-- Sync Result Button -->
      <button onclick="transferResultToApp()" class="w-full mt-3 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 rounded-xl transition">
        Use Result in App
      </button>
    </div>
  </div>

  <script>
    let html5QrCode = null;

    // --- Camera Scanner Logic ---
    function toggleScanner() {
      const readerDiv = document.getElementById('reader');
      const scanBtn = document.getElementById('scanBtn');

      if (readerDiv.classList.contains('hidden')) {
        readerDiv.classList.remove('hidden');
        scanBtn.innerText = "Close Scanner";
        scanBtn.classList.replace('bg-emerald-600', 'bg-red-600');

        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (decodedText) => {
            parseUPIString(decodedText);
            stopScanner();
          },
          () => {}
        ).catch(() => {
          alert("Camera access denied or unavailable.");
          stopScanner();
        });
      } else {
        stopScanner();
      }
    }

    function stopScanner() {
      const readerDiv = document.getElementById('reader');
      const scanBtn = document.getElementById('scanBtn');
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          readerDiv.classList.add('hidden');
          scanBtn.innerText = "Scan QR Code with Camera";
          scanBtn.classList.replace('bg-red-600', 'bg-emerald-600');
        }).catch(() => {});
      }
    }

    // Parse scanned QR code into form fields
    function parseUPIString(qrData) {
      try {
        if (qrData.startsWith("upi://pay")) {
          const urlParams = new URLSearchParams(qrData.split('?')[1]);
          const pa = urlParams.get('pa');
          const pn = urlParams.get('pn');
          const am = urlParams.get('am');

          if (pa) document.getElementById('upiId').value = pa;
          if (pn) document.getElementById('payeeName').value = decodeURIComponent(pn);
          if (am) document.getElementById('totalAmount').value = am;

          alert("Scanned! UPI ID and Payee details loaded. Enter an amount to split or pay.");
        } else {
          alert("Scanned QR is not a valid UPI code.");
        }
      } catch (e) {
        alert("Failed to read QR code.");
      }
    }

    // --- Splitter & Generator Logic ---
    function getRandomChunk(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateSplits() {
      const upiId = document.getElementById('upiId').value.trim();
      const payeeName = encodeURIComponent(document.getElementById('payeeName').value.trim());
      const totalAmount = parseFloat(document.getElementById('totalAmount').value);
      const splitMode = document.getElementById('splitMode').value;
      const container = document.getElementById('linksContainer');
      
      container.innerHTML = '';
      if (!upiId || !totalAmount || totalAmount <= 0) {
        alert("Please enter a valid UPI ID and Amount.");
        return;
      }

      let remaining = totalAmount;
      let index = 1;

      if (splitMode === 'full') {
        // Full Single Payment Mode
        createPaymentCard(container, 1, totalAmount.toFixed(2), upiId, payeeName);
      } else {
        // Split Mode
        while (remaining > 0) {
          let chunkSize;
          if (splitMode === 'fixed') {
            chunkSize = Math.min(remaining, 1999);
          } else { // Random (₹1,599 – ₹1,959)
            let randomVal = getRandomChunk(1599, 1959);
            chunkSize = (remaining < 1599) ? remaining : Math.min(remaining, randomVal);
          }

          const currentAmount = chunkSize.toFixed(2);
          createPaymentCard(container, index, currentAmount, upiId, payeeName);
          remaining -= chunkSize;
          index++;
        }
      }

      document.getElementById('totalChunksBadge').innerText = splitMode === 'full' ? 'Single Payment' : `${index - 1} QR Code(s)`;
      document.getElementById('results').classList.remove('hidden');
    }

    function createPaymentCard(container, index, amount, upiId, payeeName) {
      const upiUri = `upi://pay?pa=${upiId}&pn=${payeeName}&am=${amount}&cu=INR`;
      const qrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(upiUri)}&size=160`;

      const card = document.createElement('div');
      card.className = "p-3 border rounded-xl bg-gray-50 flex flex-col items-center gap-2 shadow-sm";
      card.innerHTML = `
        <div class="w-full flex justify-between items-center border-b pb-2">
          <span class="font-bold text-gray-800 text-sm">Payment #${index}</span>
          <span class="font-extrabold text-blue-600 text-base">₹${amount}</span>
        </div>
        <img src="${qrUrl}" alt="QR Code" class="w-32 h-32 rounded border bg-white p-1 my-1">
        <div class="w-full flex gap-2 mt-1">
          <a href="${upiUri}" class="flex-1 bg-blue-600 text-white py-1.5 px-2 rounded-lg text-xs font-medium text-center hover:bg-blue-700 transition">
            Open App to Pay ₹${amount}
          </a>
          <button onclick="navigator.clipboard.writeText('${upiUri}'); alert('UPI Link copied!')" class="bg-gray-200 text-gray-700 py-1.5 px-2 rounded-lg text-xs font-medium hover:bg-gray-300 transition">
            Copy
          </button>
        </div>
      `;
      container.appendChild(card);
    }

    // --- Calculator Engine ---
    let calcExpr = localStorage.getItem('calcExpr') || "";
    let memoryVal = parseFloat(localStorage.getItem('calcMemoryVal')) || 0;
    let historyArr = JSON.parse(localStorage.getItem('calcHistoryArr') || "[]");

    window.addEventListener('DOMContentLoaded', () => {
      updateCalcDisplay();
      renderHistory();
    });

    function autoSaveCalc() {
      localStorage.setItem('calcExpr', calcExpr);
      localStorage.setItem('calcMemoryVal', memoryVal.toString());
      localStorage.setItem('calcHistoryArr', JSON.stringify(historyArr));
    }

    function toggleCalc() {
      document.getElementById('calcModal').classList.toggle('hidden');
    }

    function toggleScientific() {
      document.getElementById('sciPanel').classList.toggle('hidden');
    }

    function calcInput(val) {
      if (calcExpr === "0" && !isNaN(val)) calcExpr = "";
      calcExpr += val;
      updateCalcDisplay();
      autoSaveCalc();
    }

    function calcClear() {
      calcExpr = "";
      document.getElementById('calcExpression').innerText = "";
      updateCalcDisplay();
      autoSaveCalc();
    }

    function calcToggleSign() {
      if (calcExpr) {
        calcExpr = calcExpr.startsWith('-') ? calcExpr.substring(1) : '-' + calcExpr;
        updateCalcDisplay();
        autoSaveCalc();
      }
    }

    function updateCalcDisplay() {
      document.getElementById('calcDisplay').innerText = calcExpr || "0";
    }

    function renderHistory() {
      const historyDiv = document.getElementById('calcHistory');
      historyDiv.innerHTML = "";
      historyArr.forEach(item => {
        const entry = document.createElement('div');
        entry.innerText = item;
        historyDiv.appendChild(entry);
      });
      historyDiv.scrollTop = historyDiv.scrollHeight;
    }

    function calcEqual() {
      try {
        if (!calcExpr) return;
        const formattedExpr = calcExpr.replace(/%/g, '/100');
        const result = eval(formattedExpr);
        
        const logEntry = `${calcExpr} = ${result}`;
        historyArr.push(logEntry);
        renderHistory();

        document.getElementById('calcExpression').innerText = calcExpr + " =";
        calcExpr = result.toString();
        updateCalcDisplay();
        autoSaveCalc();
      } catch (e) {
        document.getElementById('calcDisplay').innerText = "Error";
        calcExpr = "";
        autoSaveCalc();
      }
    }

    function calcMem(action) {
      const currentNum = parseFloat(calcExpr) || 0;
      if (action === 'MC') memoryVal = 0;
      if (action === 'MR') { calcExpr = memoryVal.toString(); updateCalcDisplay(); }
      if (action === 'M+') memoryVal += currentNum;
      if (action === 'M-') memoryVal -= currentNum;
      autoSaveCalc();
    }

    function clearCalcHistory() {
      historyArr = [];
      renderHistory();
      autoSaveCalc();
    }

    function transferResultToApp() {
      const val = parseFloat(calcExpr);
      if (!isNaN(val) && val > 0) {
        document.getElementById('totalAmount').value = val;
        toggleCalc();
      } else {
        alert("Perform a valid calculation first.");
      }
    }
  </script>
</body>
</html>
