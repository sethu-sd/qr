<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart UPI Splitter & Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-3">

  <div class="bg-white p-5 rounded-2xl shadow-xl w-full max-w-sm border border-gray-200">
    <h1 class="text-xl font-bold text-gray-800 mb-4 text-center">UPI Payment Splitter</h1>
    
    <!-- Camera Scanner Section -->
    <div class="mb-4">
      <button id="scanBtn" onclick="toggleScanner()" class="w-full bg-emerald-600 text-white py-2 px-3 rounded-lg font-medium text-sm hover:bg-emerald-700 transition flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        Scan QR Code with Camera
      </button>
      <div id="reader" class="mt-3 rounded-lg overflow-hidden hidden border border-gray-300"></div>
    </div>

    <!-- Inputs -->
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-600">UPI ID (VPA)</label>
        <input type="text" id="upiId" placeholder="example@upi" class="w-full mt-1 p-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600">Payee Name</label>
        <input type="text" id="payeeName" placeholder="Merchant Name" class="w-full mt-1 p-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600">Total Amount (₹)</label>
        <input type="number" id="totalAmount" placeholder="e.g. 12899" class="w-full mt-1 p-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- Mode Selector -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Splitting Mode</label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="btnFixed" onclick="setMode('fixed')" class="py-2 border rounded-lg font-medium text-xs bg-blue-600 text-white transition text-center">
            Fixed (₹1,999)
          </button>
          <button type="button" id="btnRandom" onclick="setMode('random')" class="py-2 border rounded-lg font-medium text-xs bg-gray-200 text-gray-700 transition text-center">
            Random (₹1.5k–1.9k)
          </button>
        </div>
      </div>

      <button onclick="generateSplits()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-blue-700 transition">Generate QR Codes</button>
    </div>

    <!-- Results Section -->
    <div id="results" class="mt-5 space-y-3 hidden">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-gray-800">Generated Payments</h2>
        <span id="totalChunksBadge" class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full font-medium"></span>
      </div>
      <div id="linksContainer" class="space-y-3"></div>
    </div>
  </div>

  <script>
    let currentMode = 'fixed';
    let html5QrCode = null;

    function setMode(mode) {
      currentMode = mode;
      const btnFixed = document.getElementById('btnFixed');
      const btnRandom = document.getElementById('btnRandom');

      if (mode === 'fixed') {
        btnFixed.className = "py-2 border rounded-lg font-medium text-xs bg-blue-600 text-white transition text-center";
        btnRandom.className = "py-2 border rounded-lg font-medium text-xs bg-gray-200 text-gray-700 transition text-center";
      } else {
        btnRandom.className = "py-2 border rounded-lg font-medium text-xs bg-blue-600 text-white transition text-center";
        btnFixed.className = "py-2 border rounded-lg font-medium text-xs bg-gray-200 text-gray-700 transition text-center";
      }
    }

    function getRandomChunk(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // Camera Scanner Controls
    function toggleScanner() {
      const readerDiv = document.getElementById('reader');
      const scanBtn = document.getElementById('scanBtn');

      if (readerDiv.classList.contains('hidden')) {
        readerDiv.classList.remove('hidden');
        scanBtn.innerText = "Close Camera Scanner";
        scanBtn.classList.replace('bg-emerald-600', 'bg-red-600');

        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (decodedText) => {
            parseUPIString(decodedText);
            stopScanner();
          },
          () => {} // Scanning loop
        ).catch(err => {
          alert("Camera permission denied or unavailable.");
          stopScanner();
        });
      } else {
        stopScanner();
      }
    }

    function stopScanner() {
      const readerDiv = document.getElementById('reader');
      const scanBtn = document.getElementById('scanBtn');
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          readerDiv.classList.add('hidden');
          scanBtn.innerText = "Scan QR Code with Camera";
          scanBtn.classList.replace('bg-red-600', 'bg-emerald-600');
        }).catch(() => {});
      }
    }

    // Parse scanned QR data automatically into inputs
    function parseUPIString(qrData) {
      try {
        if (qrData.startsWith("upi://pay")) {
          const urlParams = new URLSearchParams(qrData.split('?')[1]);
          const pa = urlParams.get('pa');
          const pn = urlParams.get('pn');
          const am = urlParams.get('am');

          if (pa) document.getElementById('upiId').value = pa;
          if (pn) document.getElementById('payeeName').value = decodeURIComponent(pn);
          if (am) document.getElementById('totalAmount').value = am;
          alert("UPI QR details loaded successfully!");
        } else {
          alert("Scanned QR is not a valid UPI payment code.");
        }
      } catch (e) {
        alert("Failed to parse QR code.");
      }
    }

    function generateSplits() {
      const upiId = document.getElementById('upiId').value.trim();
      const payeeName = encodeURIComponent(document.getElementById('payeeName').value.trim());
      const totalAmount = parseFloat(document.getElementById('totalAmount').value);
      const container = document.getElementById('linksContainer');
      
      container.innerHTML = '';
      if (!upiId || !totalAmount || totalAmount <= 0) {
        alert("Please enter a valid UPI ID and amount.");
        return;
      }

      let remaining = totalAmount;
      let index = 1;

      while (remaining > 0) {
        let chunkSize;
        if (currentMode === 'fixed') {
          chunkSize = Math.min(remaining, 1999);
        } else {
          let randomVal = getRandomChunk(1599, 1959);
          chunkSize = (remaining < 1599) ? remaining : Math.min(remaining, randomVal);
        }

        const currentAmount = chunkSize.toFixed(2);
        const upiUri = `upi://pay?pa=${upiId}&pn=${payeeName}&am=${currentAmount}&cu=INR`;
        const qrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(upiUri)}&size=160`;

        const card = document.createElement('div');
        card.className = "p-3 border rounded-xl bg-gray-50 flex flex-col items-center gap-2 shadow-sm";
        card.innerHTML = `
          <div class="w-full flex justify-between items-center border-b pb-2">
            <span class="font-bold text-gray-800 text-sm">Chunk #${index}</span>
            <span class="font-extrabold text-blue-600 text-base">₹${currentAmount}</span>
          </div>

          <img src="${qrUrl}" alt="QR Code" class="w-32 h-32 rounded border bg-white p-1 my-1">

          <div class="w-full flex gap-2 mt-1">
            <a href="${upiUri}" class="flex-1 bg-blue-600 text-white py-1.5 px-2 rounded-lg text-xs font-medium text-center hover:bg-blue-700 transition">
              Pay ₹${currentAmount}
            </a>
            <button onclick="navigator.clipboard.writeText('${upiUri}'); alert('UPI link copied!')" class="bg-gray-200 text-gray-700 py-1.5 px-2 rounded-lg text-xs font-medium hover:bg-gray-300 transition">
              Copy Link
            </button>
          </div>
        `;
        
        container.appendChild(card);
        remaining -= chunkSize;
        index++;
      }

      document.getElementById('totalChunksBadge').innerText = `${index - 1} QR Code(s)`;
      document.getElementById('results').classList.remove('hidden');
    }
  </script>
</body>
</html>
            Random (₹1,599 - ₹1,959)
          </button>
        </div>
      </div>

      <button onclick="generateSplits()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition">Generate QR Codes</button>
    </div>

    <!-- Output List -->
    <div id="results" class="mt-6 space-y-3 hidden">
      <h2 class="text-lg font-semibold text-gray-700">Generated UPI Links</h2>
      <div id="linksContainer" class="space-y-2"></div>
    </div>
  </div>

  <script>
    let currentMode = 'fixed';

    function setMode(mode) {
      currentMode = mode;
      const btnFixed = document.getElementById('btnFixed');
      const btnRandom = document.getElementById('btnRandom');

      if (mode === 'fixed') {
        btnFixed.className = "py-2 border rounded-lg font-medium text-sm bg-blue-600 text-white transition";
        btnRandom.className = "py-2 border rounded-lg font-medium text-sm bg-gray-200 text-gray-700 transition";
      } else {
        btnRandom.className = "py-2 border rounded-lg font-medium text-sm bg-blue-600 text-white transition";
        btnFixed.className = "py-2 border rounded-lg font-medium text-sm bg-gray-200 text-gray-700 transition";
      }
    }

      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateSplits() {
      const upiId = document.getElementById('upiId').value.trim();
      const payeeName = encodeURIComponent(document.getElementById('payeeName').value.trim());
      const totalAmount = parseFloat(document.getElementById('totalAmount').value);
      const container = document.getElementById('linksContainer');

          }
        }

        const currentAmount = chunkSize.toFixed(2);

        const card = document.createElement('div');
        card.className = "p-3 border rounded-lg flex justify-between items-center bg-gray-50";
        card.innerHTML = `
          <div>
            <p class="font-bold text-gray-800">Chunk #${index}: ₹${currentAmount}</p>
            <a href="${upiUri}" class="text-xs text-blue-600 underline">Pay via UPI App</a>
          </div>
          <img src="${qrUrl}" alt="QR Code" class="w-16 h-16 rounded border">
        `;
        
        container.appendChild(card);
        remaining -= chunkSize;
        index++;
      }

      document.getElementById('results').classList.remove('hidden');
    }
  </script>
</body>
</html>

          </button>
        </div>
      </div>

      <button onclick="generateSplits()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition">Generate QR Codes</button>
    </div>

    <!-- Output List -->
    <div id="results" class="mt-6 space-y-3 hidden">
      <h2 class="text-lg font-semibold text-gray-700">Generated UPI Links</h2>
      <div id="linksContainer" class="space-y-2"></div>
    </div>

  <script>
    let currentMode = 'fixed';

    function setMode(mode) {
      currentMode = mode;
      const btnFixed = document.getElementById('btnFixed');

      if (mode === 'fixed') {
        btnFixed.className = "py-2 border rounded-lg font-medium text-sm bg-blue-600 text-white transition";

      } else {
        btnRandom.className = "py-2 border rounded-lg font-medium text-sm bg-blue-600 text-white transition";
        btnFixed.className = "py-2 border rounded-lg font-medium text-sm bg-gray-200 text-gray-700 transition";
      }
    }

    // Returns a random integer between min and max (inclusive)
    function getRandomChunk(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateSplits() {
      const upiId = document.getElementById('upiId').value.trim();
      const payeeName = encodeURIComponent(document.getElementById('payeeName').value.trim());
      const totalAmount = parseFloat(document.getElementById('totalAmount').value);
      const container = document.getElementById('linksContainer');
      
      container.innerHTML = '';
      if (!upiId || !totalAmount || totalAmount <= 0) {
        alert("Please enter a valid UPI ID and amount.");
        return;
      }

      let remaining = totalAmount;
      let index = 1;

      while (remaining > 0) {
        let chunkSize;

        if (currentMode === 'fixed') {
          chunkSize = Math.min(remaining, 1999);
        } else {
          // Select random amount between 1599 and 1959
          let randomVal = getRandomChunk(1599, 1959);
          
          // If the remaining balance is smaller than the lower bound (1599), use the rest
          if (remaining < 1599) {
            chunkSize = remaining;
          } else {
            chunkSize = Math.min(remaining, randomVal);
          }
        }

        const currentAmount = chunkSize.toFixed(2);
        const upiUri = `upi://pay?pa=${upiId}&pn=${payeeName}&am=${currentAmount}&cu=INR`;
        const qrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(upiUri)}&size=150`;

        const card = document.createElement('div');
        card.className = "p-3 border rounded-lg flex justify-between items-center bg-gray-50";
        card.innerHTML = `
          <div>
            <p class="font-bold text-gray-800">Chunk #${index}: ₹${currentAmount}</p>
            <a href="${upiUri}" class="text-xs text-blue-600 underline">Pay via UPI App</a>
          </div>
          <img src="${qrUrl}" alt="QR Code" class="w-16 h-16 rounded border">
        `;
        
        container.appendChild(card);
        remaining -= chunkSize;
        index++;
      }

      document.getElementById('results').classList.remove('hidden');
    }
  </script>
</body>
</html>
